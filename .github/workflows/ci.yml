name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    # Public repositories cannot call the private fleet workflow.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the local Cloudflare asset runtime
        env:
          WRANGLER_SEND_METRICS: "false"
          CI: "true"
        run: |
          mkdir -p .wrangler
          setsid npx --yes wrangler@4.156.0 dev --local --ip 127.0.0.1 --port 21134 --inspector-port 21136 > .wrangler/hosting-check.log 2>&1 &
          echo $! > .wrangler/hosting-check.pid
          trap 'kill -- -$(cat .wrangler/hosting-check.pid) 2>/dev/null || true' EXIT
          node verify/site-http.mjs || { cat .wrangler/hosting-check.log; exit 1; }
  deploy:
    name: Deploy production Pages site
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture the existing production deployment and policies
        run: node verify/pages-production.mjs capture
      - name: Publish site to the existing production project
        run: |
          npx --yes wrangler@4.156.0 pages deploy site --project-name resurface --branch main \
            --commit-hash "$(git rev-parse HEAD)" --commit-dirty=false
      - name: Verify the production commit, files and policies
        run: node verify/pages-production.mjs verify
