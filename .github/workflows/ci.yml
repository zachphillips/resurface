name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    # Public repositories cannot call the private fleet workflow.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the local Cloudflare asset runtime
        env:
          WRANGLER_SEND_METRICS: "false"
          CI: "true"
        run: |
          mkdir -p .wrangler
          setsid npx --yes wrangler@4.156.0 dev --local --ip 127.0.0.1 --port 21134 --inspector-port 21136 > .wrangler/hosting-check.log 2>&1 &
          echo $! > .wrangler/hosting-check.pid
          trap 'kill -- -$(cat .wrangler/hosting-check.pid) 2>/dev/null || true' EXIT
          node verify/site-http.mjs || { cat .wrangler/hosting-check.log; exit 1; }
